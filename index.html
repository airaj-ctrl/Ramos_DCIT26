<!DOCTYPE html>

<head>
   

    <title>maj portfolio</title>

    <style>
        /* GENERAL */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Garamond, serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.6;
        }

        body.modal-open {
            overflow: hidden;
        }

        /* HEADER */

        header {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            background-color: #000000;
        }

        header h1 {
            color: #ffffff;
            font-size: 40px;
            margin-bottom: 20px;
        }

        /* NAVIGATION */

        nav {
            position: sticky;
            top: 0;
            z-index: 500;
            background-color: #000000;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #6495ED;
        }

        /* BUTTONS */

        .button {
            display: inline-block;
            background-color: #ADD8E6;
            color: #000000;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            margin: 5px;
            font-size: 16px;
            font-weight: bold;
            font-family: Garamond, serif;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .button:hover {
            background-color: #6495ED;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* SECTIONS */

        .content-section {
            width: 90%;
            max-width: 500px;
            min-height: 400px;
            margin: 80px auto;
            padding: 40px 30px;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #6495ED;
            border-radius: 20px;
            text-align: center;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            box-shadow: 0 0 15px rgba(100, 149, 237, 0.15);
        }

        /* PROFILE */

        .pfp {
            width: 170px;
            height: 170px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #6495ED;
            margin-bottom: 20px;
            cursor: zoom-in;
        }

        .profile-name {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .profile-description {
            font-size: 17px;
            color: #cccccc;
        }

        /* HEADINGS */

        .content-section h2 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 30px;
        }

        .content-section h3 {
            color: #ffffff;
            margin: 20px 0 15px;
        }

        /* IMAGE CONTAINER */

        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        /* IMAGE CARDS */

        .photo-card {
            display: block;
            background-color: #000000;
            padding: 10px;
            border: 2px solid #6495ED;
            border-radius: 12px;
            transition: 0.3s ease;
            cursor: zoom-in;
        }

        .photo-card:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(100, 149, 237, 0.4);
        }

        .photo {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        /* ACTIVITIES */

        .activity-box {
            background-color: #000000;
            color: #ffffff;
            padding: 25px;
            border: 2px solid #6495ED;
            border-radius: 15px;
            margin-top: 20px;
        }

        .activity-box h3 {
            color: #ADD8E6;
        }

        .activity-box p {
            color: #cccccc;
        }

        /* PHOTO ZOOM MODAL */

        .photo-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.95);

            justify-content: center;
            align-items: center;

            padding: 60px 20px 20px;
        }

        .photo-modal.show {
            display: flex;
        }

        .modal-image {
            display: block;
            max-width: 95%;
            max-height: 85vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border: 2px solid #6495ED;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(100, 149, 237, 0.35);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 25px;

            background: transparent;
            border: none;
            color: #ffffff;

            font-family: Arial, sans-serif;
            font-size: 40px;
            line-height: 1;
            cursor: pointer;

            transition: 0.3s ease;
        }

        .close-modal:hover {
            color: #ADD8E6;
            transform: scale(1.15);
        }

        /* FOOTER */

        footer {
            text-align: center;
            color: #cccccc;
            padding: 30px 20px;
            margin-top: 50px;
            background-color: #000000;
        }
        /* QUIZ ITEMS */

.quiz-item {
    width: 100%;
    margin-top: 20px;
}

.quiz-item h3 {
    color: #ADD8E6;
    margin-bottom: 15px;
}

.quiz-item .image-container {
    margin-top: 10px;
}

        /* MOBILE */

        @media (max-width: 600px) {
            header h1 {
                font-size: 30px;
            }

            nav {
                padding: 10px;
            }

            .button {
                width: 100%;
                max-width: 250px;
                text-align: center;
            }

            .content-section {
                width: 92%;
                min-height: 400px;
                padding: 30px 20px;
            }

            .pfp {
                width: 140px;
                height: 140px;
            }

            .photo {
                width: 150px;
                height: 150px;
            }

            .modal-image {
                max-width: 100%;
                max-height: 80vh;
            }

            .close-modal {
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>
        <h1>welcome to my portfolio!</h1>

        <a href="#profile" class="button section-link">
            about me
        </a>
    </header>

    <!-- NAVIGATION -->

    <nav>
        <a href="#profile" class="button section-link">profile</a>
        <a href="#quizzes" class="button section-link">quizzes</a>
        <a href="#exams" class="button section-link">exams</a>
        <a href="#activities" class="button section-link">activities</a>
    </nav>

    <!-- PROFILE -->

    <section id="profile" class="content-section">

        <img
            src="./maj/pfp.jpg"
            alt="Profile picture of Majah Aira Jane B. Ramos"
            class="pfp zoomable"
        >

        <h2 class="profile-name">
            Majah Aira Jane B. Ramos
        </h2>

        <p class="profile-description">
            hi! my name is aira, a 3rd year BSCS student : ).
        </p>

    </section>

    <!-- =========================
     QUIZZES
========================= -->

<section id="quizzes" class="content-section">

    <h2>my quizzes</h2>

    <!-- QUIZ 1 -->
    <div class="quiz-item">

        <h3>quiz 1</h3>

        <div class="image-container">

            <a href="./maj/qp1.jpg" class="photo-card zoom-link">
                <img
                    src="./maj/qp1.jpg"
                    alt="Quiz 1 Page 1"
                    class="photo zoomable"
                >
            </a>

            <a href="./maj/qp2.jpg" class="photo-card zoom-link">
                <img
                    src="./maj/qp2.jpg"
                    alt="Quiz 1 Page 2"
                    class="photo zoomable"
                >
            </a>

        </div>

    </div>

    <!-- QUIZ 2 -->
    <div class="quiz-item">

        <h3>quiz 2</h3>

        <div class="image-container">

            <a href="./maj/quiz2.jpg" class="photo-card zoom-link">
                <img
                    src="./maj/quiz2.jpg"
                    alt="Quiz 2"
                    class="photo zoomable"
                >
            </a>

        </div>

    </div>

    <!-- QUIZ 3 -->
    <div class="quiz-item">

        <h3>quiz 3</h3>

        <div class="image-container">

            <a href="./maj/quiz3.jpg" class="photo-card zoom-link">
                <img
                    src="./maj/quiz3.jpg"
                    alt="Quiz 3"
                    class="photo zoomable"
                >
            </a>

        </div>

    </div>

    <!-- LONG QUIZ -->
    <div class="quiz-item">

        <h3>long quiz</h3>

        <div class="image-container">

            <a href="./maj/longquiz.jpg" class="photo-card zoom-link">
                <img
                    src="./maj/longquiz.jpg"
                    alt="Long Quiz"
                    class="photo zoomable"
                >
            </a>

        </div>

    </div>

</section>

    <!-- EXAMS -->

    <section id="exams" class="content-section">

        <h2>my exams</h2>

        <h3>midterms</h3>

        <div class="image-container">

            <a href="./maj/midterms.jpg" class="photo-card zoom-link">
                <img
                    src="./maj/midterms.jpg"
                    alt="Midterm Exam"
                    class="photo zoomable"
                >
            </a>

        </div>

    </section>

    <!-- ACTIVITIES -->

    <section id="activities" class="content-section">

        <h2>my activities</h2>

        <div class="activity-box">

            <h3>lab activities</h3>

            <p>
                This section contains my laboratory activities.
            </p>

        </div>

    </section>

    <!-- PHOTO ZOOM MODAL -->

    <div
        id="photoModal"
        class="photo-modal"
        role="dialog"
        aria-modal="true"
        aria-label="Enlarged photo preview"
        aria-hidden="true"
    >

        <button
            type="button"
            class="close-modal"
            id="closeModal"
            aria-label="Close enlarged photo"
        >
            &times;
        </button>

        <img
            id="modalImage"
            class="modal-image"
            src=""
            alt=""
        >

    </div>


    <script>

        document.querySelectorAll(".section-link").forEach(function(link) {
            link.addEventListener("click", function(event) {
                event.preventDefault();

                const target = document.querySelector(
                    this.getAttribute("href")
                );

                if (!target) return;

                const nav = document.querySelector("nav");
                const navHeight = nav.offsetHeight;

                // Center the section in the visible area below the navigation.
                const visibleCenter =
                    (window.innerHeight + navHeight) / 2;

                const targetPosition =
                    target.getBoundingClientRect().top +
                    window.scrollY +
                    target.offsetHeight / 2 -
                    visibleCenter;

                const maxScroll =
                    document.documentElement.scrollHeight -
                    window.innerHeight;

                window.scrollTo({
                    top: Math.max(
                        0,
                        Math.min(targetPosition, maxScroll)
                    ),
                    behavior: "smooth"
                });

                // Update the URL without opening another page.
                history.replaceState(null, "", this.getAttribute("href"));
            });
        });

        // PHOTO ZOOM ELEMENTS

        const photoModal = document.getElementById("photoModal");
        const modalImage = document.getElementById("modalImage");
        const closeModal = document.getElementById("closeModal");

        let previousFocus = null;

        // OPEN AN ENLARGED PHOTO ON THE SAME PAGE

        function openPhoto(image) {
            previousFocus = image;

            modalImage.src = image.currentSrc || image.src;
            modalImage.alt = image.alt;

            photoModal.classList.add("show");
            photoModal.setAttribute("aria-hidden", "false");

            document.body.classList.add("modal-open");
            closeModal.focus();
        }

        // CLOSE THE PHOTO PREVIEW

        function closePhoto() {
            photoModal.classList.remove("show");
            photoModal.setAttribute("aria-hidden", "true");

            document.body.classList.remove("modal-open");

            modalImage.src = "";
            modalImage.alt = "";

            if (previousFocus) {
                previousFocus.focus();
                previousFocus = null;
            }
        }

        // PROFILE PHOTO: ZOOM WITHOUT LEAVING THE PAGE

        document.querySelectorAll(".pfp.zoomable").forEach(function(image) {
            image.setAttribute("tabindex", "0");

            image.addEventListener("click", function() {
                openPhoto(this);
            });

            image.addEventListener("keydown", function(event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openPhoto(this);
                }
            });
        });

        // QUIZ AND EXAM PHOTOS: PREVENT NEW TABS

        document.querySelectorAll(".zoom-link").forEach(function(link) {
            link.addEventListener("click", function(event) {
                event.preventDefault();

                const image = this.querySelector("img");

                if (image) {
                    openPhoto(image);
                }
            });
        });

        // CLOSE BUTTON

        closeModal.addEventListener("click", closePhoto);

        // CLICK OUTSIDE THE IMAGE TO CLOSE

        photoModal.addEventListener("click", function(event) {
            if (event.target === photoModal) {
                closePhoto();
            }
        });

        // PRESS ESCAPE TO CLOSE

        document.addEventListener("keydown", function(event) {
            if (
                event.key === "Escape" &&
                photoModal.classList.contains("show")
            ) {
                closePhoto();
            }
        });
    </script>

</body>
</html>
