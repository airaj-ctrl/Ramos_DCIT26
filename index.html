<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Main Page */
        body {
            padding: 50px;
            text-align: center;
            background-color: #000000;
            color: #FFFFFF;
        }

        /* Headings */
        h2 {
            margin-bottom: 15px;
        }

        /* Description */
        .description {
            margin-top: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Profile Picture */
        .profile-picture {
            width: 170px;
            height: 170px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid white;
            margin: 20px auto;
            display: block;
        }

        /* Navigation */
        nav {
            background-color: #fbf9f9;
            padding: 10px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        /* Buttons */
        .button {
            background-color: #ADD8E6;
            color: black;
            padding: 15px 32px;
            font-size: 16px;
            margin: 4px;
            cursor: pointer;
            border-radius: 10px;
        }

        /* Quiz Section */
        .quiz {
            background-color: #89CFF0;
            color: black;
            padding: 20px;
            border-radius: 15px;
            margin-top: 10px;
        }

        /* Activity Section */
        .act {
            background-color: #6495ED;
            color: black;
            padding: 20px;
            border-radius: 15px;
            margin-top: 10px;
        }

        /* Content Box */
        .content-section {
            margin: 40px auto;
            padding: 30px;
            width: 90%;
            max-width: 900px;
            background-color: white;
            border-radius: 15px;
            text-align: center;
        }

        /* Photo Container */
        .photo-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        /* Photo Card */
        .photo-card {
            width: 250px;
            background-color: #f5f5f5;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 4px 10px black;
        }

        /* Images inside cards */
        .photo-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: none;
            display: block;
            margin-bottom: 15px;
        }

        /* Space between Quiz 1 front and back */
        .quiz-image {
            margin-bottom: 15px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            .content-section {
                width: 100%;
                padding: 20px;
            }

            .button {
                padding: 12px 18px;
            }
        }
    </style>

    <script src="./maj/script.js"></script>
</head>

<body>

    <!-- Introduction -->
    <header>
        <h2>Welcome to my portfolio!</h2>

        <img src="./maj/pfp.jpg"
             alt="Majah Aira Jane B. Ramos"
             class="profile-picture">

        <h2>Majah Aira Jane B. Ramos</h2>

        <p class="description">
            Hi! My name is Aira, a 3rd year BSCS student. :)
        </p>
    </header>


    <!-- Navigation -->
    <nav>
        <div>
            <button class="button" onclick="showSection('about')">
                About Me
            </button>

            <button class="button" onclick="showSection('quizzes')">
                Quizzes
            </button>

            <button class="button" onclick="showSection('activities')">
                Activities
            </button>
        </div>
    </nav>


    <!-- Quiz Section -->
    <section class="quiz" id="quizzes">

        <div class="content-section">

            <h2>My Quizzes</h2>

            <div class="photo-container">

                <div class="photo-card">

                    <a href="./maj/qp1.jpg" target="_blank">
                        <img src="./maj/qp1.jpg"
                             alt="Quiz 1 Front"
                             class="quiz-image">
                    </a>

                    <a href="./maj/qp2.jpg" target="_blank">
                        <img src="./maj/qp2.jpg"
                             alt="Quiz 1 Back">
                    </a>

                    <h3>Quiz 1</h3>

                </div>

            </div>

        </div>

    </section>


    <!-- Activities Section -->
    <section class="act" id="activities">

        <div class="content-section">

            <h2>My Activities</h2>

            <div class="photo-container">

                <div class="photo-card">

                    <img src="./maj/maj2.jpg"
                         alt="Activity 1">

                    <h3>Activity 1</h3>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
